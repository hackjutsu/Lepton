name: Tauri prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'configs/**'
      - 'prototypes/tauri/**'
      - '.github/workflows/tauri-prototype.yml'
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'configs/**'
      - 'prototypes/tauri/**'
      - '.github/workflows/tauri-prototype.yml'

permissions:
  contents: read

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      LEPTON_UI_SCREENSHOT: ${{ runner.temp }}/lepton-tauri-ui.png
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm ci
        working-directory: prototypes/tauri
      - name: Rust unit tests
        run: cargo test --locked --manifest-path prototypes/tauri/src-tauri/Cargo.toml
      - name: Tauri UI smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
        working-directory: prototypes/tauri
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      - name: Tauri UI smoke tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui
        working-directory: prototypes/tauri
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ui-${{ runner.os }}
          path: ${{ runner.temp }}/lepton-tauri-ui.png
          if-no-files-found: ignore
