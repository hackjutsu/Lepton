name: Tauri prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'build/icon/**'
      - 'configs/**'
      - 'prototypes/tauri/**'
      - '.all-contributorsrc'
      - '.nvmrc'
      - 'license.json'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - '.github/workflows/tauri-prototype.yml'
      - '.github/workflows/rust-release.yml'
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'build/icon/**'
      - 'configs/**'
      - 'prototypes/tauri/**'
      - '.all-contributorsrc'
      - '.nvmrc'
      - 'license.json'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - '.github/workflows/tauri-prototype.yml'
      - '.github/workflows/rust-release.yml'

permissions:
  contents: read

jobs:
  release-build:
    name: Release bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-25.02
            bundle: deb,appimage
            target: linux-xarm92
          - os: macos-15
            bundle: app
            target: macos-xarm92
          - os: macos-15-intel
            bundle: app
            target: macos-xarm92
          - os: windows-latest
            bundle: nsis
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v8
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -xyw libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf libfuse2
      - run: npm ci
      - run: npm ci
        working-directory: prototypes/tauri
      - name: Release workflow helper tests
        run: node --test prototypes/tauri/tests/release.test.cjs
      - name: Build release bundle
        run: npm run package -- --bundles ${{ matrix.bundle }} -- --locked
        working-directory: prototypes/tauri
        env:
          LEPTON_GITHUB_CLIENT_ID: fixture-client-id
          LEPTON_GITHUB_CLIENT_SECRET: fixture-client-secret
          APPLE_SIGNING_IDENTITY: '-'
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash prototypes/tauri/scripts/create-macos-dmg.sh prototypes/tauri/src-tauri/target/release/bundle
      - name: Validate release artifacts
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: node prototypes/tauri/scripts/stage-release.cjs "${TARGET_NAME}" prototypes/tauri/src-tauri/target/release/bundle release-assets

  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config xvfb
      - run: npm ci
      - run: npm ci
        working-directory: prototypes/tauri
      - name: Build frontend for Rust tests
        run: npm run build
        working-directory: prototypes/tauri
      - name: Rust unit tests
        run: cargo test --locked --manifest-path prototypes/tauri/src-tauri/Cargo.toml
      - name: Tauri UI smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
        working-directory: prototypes/tauri
        env:
          LEPTON_UI_SCREENSHOT: ${{ runner.temp }}/lepton-tauri-ui.png
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      - name: Tauri UI smoke tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui
        working-directory: prototypes/tauri
        env:
          LEPTON_UI_SCREENSHOT: ${{ runner.temp }}/lepton-tauri-ui.png
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tauri-ui-${{ runner.os }}
          path: ${{ runner.temp }}/lepton-tauri-ui.png
          if-no-files-found: ignore
